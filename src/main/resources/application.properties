# Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/ai_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — auto-create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=123456  # 本地 Redis 无密码，注释掉
spring.data.redis.timeout=5000ms

# LangChain4j — DeepSeek (OpenAI compatible)
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=deepseek-chat
langchain4j.open-ai.chat-model.max-tokens=2048
langchain4j.open-ai.chat-model.temperature=0.7
# Privacy: never log full request/response payloads
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

# Streaming model
langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
langchain4j.open-ai.streaming-chat-model.max-tokens=2048
langchain4j.open-ai.streaming-chat-model.temperature=0.7

# Embedding model — SiliconFlow BGE-M3 (OpenAI compatible, 1024-dim, free)
langchain4j.open-ai.embedding-model.base-url=https://api.siliconflow.cn/v1
langchain4j.open-ai.embedding-model.api-key=${SILICONFLOW_API_KEY}
langchain4j.open-ai.embedding-model.model-name=BAAI/bge-m3

# Elasticsearch
app.elasticsearch.host=localhost
app.elasticsearch.port=9200
app.elasticsearch.index-name=kb_vectors

# Knowledge base file storage
app.kb.upload-dir=./data/kb-files
app.kb.max-file-size-mb=20

# Multipart upload limits (must match app.kb.max-file-size-mb; Spring default is 1MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
